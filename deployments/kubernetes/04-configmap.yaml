apiVersion: v1
kind: ConfigMap
metadata:
  name: event-pipeline-config
  namespace: event-pipeline
data:
  config.yaml: |
    kafka:
      brokers:
        - "kafka:9092"
      topics:
        raw: "events.raw"
        enriched: "events.enriched"
        dlq: "events.dlq"
      consumer_group: "pipeline-workers"
      producer:
        acks: "all"
        retries: 3
        batch_size: 16384
        linger_ms: 5
        compression_type: "snappy"
      consumer:
        fetch_min_bytes: 1
        fetch_max_wait_ms: 500
        max_poll_records: 500
        session_timeout_ms: 30000
        heartbeat_interval_ms: 10000
        auto_offset_reset: "earliest"
        enable_auto_commit: false

    clickhouse:
      dsn: "clickhouse://default:@clickhouse:9000/events"
      database: "events"
      batch_size: 10000
      flush_interval: "5s"
      max_open_conns: 10
      max_idle_conns: 5
      conn_max_lifetime: "1h"

    redis:
      address: "redis:6379"
      password: ""
      db: 0
      pool_size: 20
      dial_timeout: "5s"
      read_timeout: "3s"
      write_timeout: "3s"

    worker:
      concurrency: 32
      batch_timeout: "100ms"
      max_retries: 3
      retry_backoff: "1s"
      dead_letter_topic: "events.dlq"

    metrics:
      enabled: true
      port: 9090
      path: "/metrics"

    tracing:
      enabled: true
      otlp_endpoint: "tempo:4317"
      service_name: "distributed-event-pipeline"
      sample_rate: 0.1

    logging:
      level: "info"
      format: "json"
      output: "stdout"

    http:
      address: ":8080"
      read_timeout: "30s"
      write_timeout: "30s"
      idle_timeout: "120s"