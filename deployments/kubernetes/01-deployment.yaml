apiVersion: apps/v1
kind: Deployment
metadata:
  name: distributed-event-pipeline
  namespace: event-pipeline
  labels:
    app: distributed-event-pipeline
    version: v1.0.0
spec:
  replicas: 3
  selector:
    matchLabels:
      app: distributed-event-pipeline
  template:
    metadata:
      labels:
        app: distributed-event-pipeline
        version: v1.0.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: event-pipeline-sa
      containers:
        - name: consumer
          image: ghcr.io/smahud/distributed-event-pipeline:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 9090
              name: metrics
          env:
            - name: CONFIG_PATH
              value: "/app/configs/config.yaml"
          resources:
            limits:
              cpu: "2"
              memory: "2Gi"
            requests:
              cpu: "1"
              memory: "1Gi"
          volumeMounts:
            - name: config
              mountPath: /app/configs
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: config
          configMap:
            name: event-pipeline-config