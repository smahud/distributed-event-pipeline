global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'distributed-event-pipeline'
    static_configs:
      - targets: ['consumer:9090', 'producer:9090']
        labels:
          service: 'event-pipeline'

  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka:9101']
        labels:
          service: 'kafka'

  - job_name: 'clickhouse'
    static_configs:
      - targets: ['clickhouse:8123']
        labels:
          service: 'clickhouse'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']